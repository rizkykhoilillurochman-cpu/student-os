plugins { id 'com.android.application' }

android {
    namespace 'com.rizky.studentos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rizky.studentos'
        minSdk 23
        targetSdk 35
        versionCode 15
        versionName '14.5.0'
    }

    buildTypes {
        release {
            // Installable release-preview build signed with the runner's debug key.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

