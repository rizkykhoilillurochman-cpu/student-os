name: Build Student OS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Student-OS-14.5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-OS-14.5-APK
          path: Student-OS-14.5.apk
          retention-days: 30
